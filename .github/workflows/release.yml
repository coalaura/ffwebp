name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.17.0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Run integration tests
      env:
        CGO_ENABLED: 1
        CC: zig cc -target x86_64-linux-gnu
        CXX: zig c++ -target x86_64-linux-gnu
      # We do NOT pass the 'play' tag here, so tests run headlessly without Ebiten panicking
      run: go test -v ./integration

  build:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        variant: [core, full, full-play]
        include:
          - variant: core
            tags: core
          - variant: full
            tags: full
          - variant: full-play
            tags: full,play
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate Windows resources
      if: matrix.goos == 'windows'
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
        TARGET_ARCH: ${{ matrix.goarch }}
      run: |
        docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace/cmd/ffwebp --entrypoint go ghcr.io/coalaura/builder:latest run github.com/tc-hib/go-winres@latest simply \
          --manifest cli \
          --product-name FFWebP \
          --original-filename ffwebp.exe \
          --icon ../../logo.ico \
          --copyright "(c) 2026 coalaura" \
          --file-description "Convert any image format into any other image format" \
          --file-version "$RELEASE_VERSION" \
          --arch "$TARGET_ARCH"

    - name: Build ${{ matrix.goos }}_${{ matrix.goarch }} (${{ matrix.variant }})
      id: build
      uses: coalaura/build@v1
      with:
        os: ${{ matrix.goos }}
        arch: ${{ matrix.goarch }}
        cgo: true
        # Linux playback loads the system's glibc-based X11 and OpenGL libraries.
        link: ${{ matrix.goos == 'linux' && matrix.variant == 'full-play' && 'dynamic' || 'static' }}
        optimization: compatible
        generate: false
        package: ./cmd/ffwebp
        output: dist/ffwebp_${{ github.ref_name }}_${{ matrix.variant }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        go-flags: |
          -tags=${{ matrix.tags }}
          -ldflags=-X main.Version=${{ github.ref_name }}

    - name: Sign
      id: sign
      uses: coalaura/sign@v1
      with:
        path: ${{ steps.build.outputs.path }}
        key: ${{ secrets.COALAURA_PFX }}
        passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
        chain: |
          https://wiese2.org/pki/issuing.pem
          https://wiese2.org/pki/root.pem

    - name: Upload signed artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-ffwebp-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.variant }}
        path: ${{ steps.sign.outputs.path }}
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download signed artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: signed-ffwebp-*
        merge-multiple: true
        path: dist

    - name: Generate checksums
      working-directory: dist
      run: sha256sum -b ffwebp_* > SHA256SUMS

    - name: Attest signed binaries
      uses: actions/attest@v4
      with:
        subject-checksums: dist/SHA256SUMS

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/ffwebp_*
          dist/SHA256SUMS
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        name: "Release ${{ github.ref_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
